  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <sc-for list=\"{{ modalRows }}\" as=\"row\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #F9FAFB;\">\n              <span style=\"font-size:12px; color:#9CA3AF; font-weight:600; min-width:110px; text-transform:uppercase; letter-spacing:0.5px;\">{{ row.label }}<\u002Fspan>\n              <span style=\"font-size:13px; color:#111827; font-weight:500; flex:1;\">{{ row.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; margin-top:24px;\">\n          <sc-if value=\"{{ modalCanValidate }}\" hint-placeholder-val=\"{{ true }}\">\n            <button onclick=\"{{ modalValidate }}\" style=\"flex:1; background:#059669; color:#fff; border:none; border-radius:9px; height:44px; font-size:14px; font-weight:700; cursor:pointer;\">✓ Valider la commande<\u002Fbutton>\n            <button onclick=\"{{ modalRefuse }}\" style=\"background:#FEE2E2; color:#DC2626; border:none; border-radius:9px; height:44px; padding:0 16px; font-size:14px; font-weight:700; cursor:pointer;\">✗ Refuser<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ modalIsValidated }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; background:#D1FAE5; color:#059669; border-radius:9px; height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;\">✓ Commande validée<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ modalIsRefused }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; background:#FEE2E2; color:#DC2626; border-radius:9px; height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;\">✗ Commande refusée<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    loggedIn: false,\n    loginUser: '',\n    loginPass: '',\n    loginError: false,\n    page: 'commandes',\n    searchVal: '',\n    filterStatus: 'all',\n    orders: [],\n    modalOrder: null,\n    cfgUrl: '', cfgKey: '', cfgSaved: false,\n    resendKey: '', fromEmail: '', resendSaved: false,\n    newPass: '', passSaved: false,\n    adminPass: 'admin123'\n  };\n\n  DEMO_ORDERS = [\n    { id: 'CMD-DEMO1', createdAt: new Date(Date.now()-86400000*2).toISOString(), status: 'en_attente', prenom: 'Aminata', nom: 'Koné', email: 'aminata@example.com', tel: '+225 07 12 34 56', adresse: 'Cocody, Abidjan', dateSouhaitee: '2024-08-15', modePaiement: 'Mobile Money', qty: 1, produits: 'Assistant IA Personnel' },\n    { id: 'CMD-DEMO2', createdAt: new Date(Date.now()-86400000*4).toISOString(), status: 'validee', prenom: 'Ibrahim', nom: 'Diallo', email: 'ibrahim@example.com', tel: '+221 77 56 78 90', adresse: 'Plateau, Dakar', dateSouhaitee: '2024-08-10', modePaiement: 'Carte bancaire', qty: 2, produits: 'Intégration IA Pro, Consultation IA' },\n    { id: 'CMD-DEMO3', createdAt: new Date(Date.now()-86400000).toISOString(), status: 'en_attente', prenom: 'Fatoumata', nom: 'Traoré', email: 'fato@example.com', tel: '+223 66 11 22 33', adresse: 'ACI 2000, Bamako', dateSouhaitee: '', modePaiement: 'Mobile Money', qty: 1, produits: 'Développement Sur Mesure' },\n    { id: 'CMD-DEMO4', createdAt: new Date(Date.now()-86400000*6).toISOString(), status: 'refusee', prenom: 'Moussa', nom: 'Sall', email: 'moussa@example.com', tel: '+221 70 99 88 77', adresse: 'Medina, Dakar', dateSouhaitee: '2024-07-30', modePaiement: 'Espèces', qty: 1, produits: 'Consultation IA' }\n  ];\n\n  SUPABASE_URL = 'https://ghjwhhqscjhriueocqll.supabase.co';\n  SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoandoaHFzY2pocml1ZW9jcWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzQzMDcsImV4cCI6MjA5NzgxMDMwN30.lsj3XgMqsp5pR_xI7eOEsvFX3bu-i3-NZYIsSUqrgRA';\n  RESEND_KEY = 're_CYg7neWC_88GrzctRrb7ELdCXEHXFZVsD';\n\n  async componentDidMount() {\n    try {\n      const cfg = JSON.parse(localStorage.getItem('n3n_config') || '{}');\n      this.setState({\n        cfgUrl: cfg.url || this.SUPABASE_URL,\n        cfgKey: cfg.key || this.SUPABASE_KEY,\n        resendKey: cfg.resendKey || this.RESEND_KEY,\n        fromEmail: cfg.fromEmail || 'onboarding@resend.dev',\n        adminPass: cfg.adminPass || 'admin123'\n      });\n    } catch(e) {}\n    await this.fetchOrders();\n  }\n\n  async fetchOrders() {\n    try {\n      const res = await fetch(`${this.SUPABASE_URL}/rest/v1/commandes?order=created_at.desc`, {\n        headers: {\n          'apikey': this.SUPABASE_KEY,\n          'Authorization': 'Bearer ' + this.SUPABASE_KEY\n        }\n      });\n      if (res.ok) {\n        const data = await res.json();\n        const mapped = data.map(o => ({\n          id: o.id, createdAt: o.created_at, status: o.status,\n          prenom: o.prenom, nom: o.nom, email: o.email, tel: o.tel,\n          adresse: o.adresse, dateSouhaitee: o.date_souhaitee,\n          modePaiement: o.mode_paiement, qty: o.qty, produits: o.produits\n        }));\n        const allOrders = mapped.length > 0 ? mapped : this.DEMO_ORDERS;\n        this.setState({ orders: allOrders });\n      } else {\n        this.setState({ orders: this.DEMO_ORDERS });\n      }\n    } catch(e) {\n      this.setState({ orders: this.DEMO_ORDERS });\n    }\n  }\n\n  async sendConfirmationEmail(order) {\n    if (!order.email) return;\n    // Appel via Edge Function Supabase (évite les restrictions CORS de Resend)\n    const EDGE_URL = this.SUPABASE_URL + '/functions/v1/send-email';\n    try {\n      await fetch(EDGE_URL, {\n        method: 'POST',\n        headers: {\n          'Authorization': 'Bearer ' + this.SUPABASE_KEY,\n          'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({\n          to: order.email,\n          subject: '✅ Commande ' + order.id + ' confirmée — N3N AI',\n          prenom: order.prenom,\n          orderId: order.id,\n          produits: order.produits,\n          modePaiement: order.modePaiement\n        })\n      });\n    } catch(e) { console.warn('Email non envoyé :', e.message); }\n  }\n\n  async updateOrderStatus(id, status) {\n    const orders = this.state.orders.map(o => o.id === id ? { ...o, status } : o);\n    this.setState({ orders });\n    if (this.state.modalOrder && this.state.modalOrder.id === id) {\n      this.setState({ modalOrder: { ...this.state.modalOrder, status } });\n    }\n    try {\n      await fetch(`${this.SUPABASE_URL}/rest/v1/commandes?id=eq.${id}`, {\n        method: 'PATCH',\n        headers: {\n          'apikey': this.SUPABASE_KEY,\n          'Authorization': 'Bearer ' + this.SUPABASE_KEY,\n          'Content-Type': 'application/json',\n          'Prefer': 'return=minimal'\n        },\n        body: JSON.stringify({ status })\n      });\n    } catch(e) { console.warn('PATCH Supabase échoué :', e.message); }\n    if (status === 'validee') {\n      const order = this.state.orders.find(o => o.id === id);\n      if (order) await this.sendConfirmationEmail(order);\n    }\n  }\n\n  filteredOrders() {\n    const { orders, searchVal, filterStatus } = this.state;\n    return orders.filter(o => {\n      const matchStatus = filterStatus === 'all' || o.status === filterStatus;\n      const q = searchVal.toLowerCase();\n      const matchSearch = !q || o.id.toLowerCase().includes(q) || (o.prenom + ' ' + o.nom).toLowerCase().includes(q) || (o.email || '').toLowerCase().includes(q);\n      return matchStatus && matchSearch;\n    });\n  }\n\n  statusBadge(status) {\n    const map = { en_attente: { label: 'En attente', bg: '#FEF3C7', color: '#D97706' }, validee: { label: 'Validée', bg: '#D1FAE5', color: '#059669' }, refusee: { label: 'Refusée', bg: '#FEE2E2', color: '#DC2626' } };\n    return map[status] || { label: status, bg: '#F3F4F6', color: '#6B7280' };\n  }\n\n  formatDate(iso) {\n    if (!iso) return '—';\n    try { return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch(e) { return iso; }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const filtered = this.filteredOrders();\n    const all = s.orders;\n\n    const navStyle = (active) => ({\n      display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 12px', borderRadius: '8px',\n      cursor: 'pointer', fontSize: '13px', fontWeight: active ? '700' : '500',\n      color: active ? '#fff' : '#7C9FE4', background: active ? 'rgba(255,255,255,0.12)' : 'transparent',\n      transition: 'all 0.15s'\n    });\n\n    const ordersDisplay = filtered.map(o => {\n      const b = this.statusBadge(o.status);\n      return {\n        id: o.id,\n        clientName: (o.prenom || '') + ' ' + (o.nom || ''),\n        email: o.email || '—',\n        produits: o.produits || '—',\n        paiement: o.modePaiement || '—',\n        dateStr: this.formatDate(o.createdAt),\n        statusLabel: b.label,\n        badgeStyle: { display: 'inline-block', padding: '3px 10px', borderRadius: '20px', fontSize: '12px', fontWeight: '600', background: b.bg, color: b.color },\n        rowStyle: { borderBottom: '1px solid #F9FAFB', background: '#fff' },\n        canValidate: o.status === 'en_attente',\n        onView: () => this.setState({ modalOrder: o }),\n        onValidate: () => this.updateOrderStatus(o.id, 'validee'),\n        onRefuse: () => this.updateOrderStatus(o.id, 'refusee')\n      };\n    });\n\n    const countByStatus = (st) => all.filter(o => o.status === st).length;\n    const statsCards = [\n      { label: 'Total commandes', value: all.length, badge: 'Toutes', badgeStyle: { fontSize: '11px', color: '#9CA3AF', marginTop: '4px' } },\n      { label: 'En attente', value: countByStatus('en_attente'), badge: '⏳ À traiter', badgeStyle: { fontSize: '11px', color: '#D97706', marginTop: '4px', fontWeight: '600' } },\n      { label: 'Validées', value: countByStatus('validee'), badge: '✓ Confirmées', badgeStyle: { fontSize: '11px', color: '#059669', marginTop: '4px', fontWeight: '600' } },\n      { label: 'Refusées', value: countByStatus('refusee'), badge: '✗ Annulées', badgeStyle: { fontSize: '11px', color: '#DC2626', marginTop: '4px', fontWeight: '600' } }\n    ];\n\n    const total = all.length || 1;\n    const statsByStatus = [\n      { label: 'En attente', count: countByStatus('en_attente'), barStyle: { height: '100%', width: (countByStatus('en_attente') / total * 100) + '%', background: '#F59E0B', borderRadius: '4px' } },\n      { label: 'Validées', count: countByStatus('validee'), barStyle: { height: '100%', width: (countByStatus('validee') / total * 100) + '%', background: '#059669', borderRadius: '4px' } },\n      { label: 'Refusées', count: countByStatus('refusee'), barStyle: { height: '100%', width: (countByStatus('refusee') / total * 100) + '%', background: '#DC2626', borderRadius: '4px' } }\n    ];\n\n    const payCounts = {};\n    all.forEach(o => { if (o.modePaiement) payCounts[o.modePaiement] = (payCounts[o.modePaiement] || 0) + 1; });\n    const payMax = Math.max(1, ...Object.values(payCounts));\n    const statsByPay = Object.entries(payCounts).map(([k, v]) => ({ label: k, count: v, barStyle: { height: '100%', width: (v / payMax * 100) + '%', background: '#3B5BDB', borderRadius: '4px' } }));\n\n    const svcCounts = {};\n    all.forEach(o => { if (o.produits) o.produits.split(',').forEach(p => { const t = p.trim(); if (t) svcCounts[t] = (svcCounts[t] || 0) + 1; }); });\n    const svcMax = Math.max(1, ...Object.values(svcCounts));\n    const statsServices = Object.entries(svcCounts).map(([k, v]) => ({ label: k, count: v, barStyle: { height: '100%', width: (v / svcMax * 100) + '%', background: '#8B5CF6', borderRadius: '4px' } }));\n\n    const mo = s.modalOrder;\n    const moStatus = mo ? this.statusBadge(mo.status) : {};\n    const modalRows = mo ? [\n      { label: 'Référence', value: mo.id },\n      { label: 'Date', value: this.formatDate(mo.createdAt) },\n      { label: 'Client', value: (mo.prenom || '') + ' ' + (mo.nom || '') },\n      { label: 'Email', value: mo.email || '—' },\n      { label: 'Téléphone', value: mo.tel || mo.telephone || '—' },\n      { label: 'Services', value: mo.produits || '—' },\n      { label: 'Quantité', value: mo.qty || '—' },\n      { label: 'Adresse', value: mo.adresse || '—' },\n      { label: 'Date souhaitée', value: mo.dateSouhaitee || 'Non précisée' },\n      { label: 'Paiement', value: mo.modePaiement || '—' },\n      { label: 'Statut', value: moStatus.label }\n    ] : [];\n\n    return {\n      showLogin: !s.loggedIn,\n      showDashboard: s.loggedIn,\n      loginUser: s.loginUser, onLoginUserChange: e => this.setState({ loginUser: e.target.value }),\n      loginPass: s.loginPass, onLoginPassChange: e => this.setState({ loginPass: e.target.value }),\n      onLoginKey: e => { if (e.key === 'Enter') this.doLogin(); },\n      loginError: s.loginError,\n      doLogin: () => {\n        if (s.loginUser === 'admin' && s.loginPass === s.adminPass) this.setState({ loggedIn: true, loginError: false });\n        else this.setState({ loginError: true });\n      },\n      doLogout: () => this.setState({ loggedIn: false, loginUser: '', loginPass: '' }),\n      pageTitle: { commandes: 'Commandes', stats: 'Statistiques', config: 'Configuration' }[s.page] || 'Dashboard',\n      pageCommandes: s.page === 'commandes',\n      pageStats: s.page === 'stats',\n      pageConfig: s.page === 'config',\n      navCommandes: navStyle(s.page === 'commandes'),\n      navStats: navStyle(s.page === 'stats'),\n      navConfig: navStyle(s.page === 'config'),\n      goCommandes: () => this.setState({ page: 'commandes' }),\n      goStats: () => this.setState({ page: 'stats' }),\n      goConfig: () => this.setState({ page: 'config' }),\n      searchVal: s.searchVal, onSearchChange: e => this.setState({ searchVal: e.target.value }),\n      filterStatus: s.filterStatus, onFilterChange: e => this.setState({ filterStatus: e.target.value }),\n      statsCards, ordersDisplay, filteredCount: filtered.length, noOrders: filtered.length === 0,\n      statsByStatus, statsByPay, statsServices,\n      showModal: !!s.modalOrder,\n      modalId: mo ? mo.id : '',\n      modalRows,\n      modalCanValidate: mo ? mo.status === 'en_attente' : false,\n      modalIsValidated: mo ? mo.status === 'validee' : false,\n      modalIsRefused: mo ? mo.status === 'refusee' : false,\n      modalValidate: () => { this.updateOrderStatus(mo.id, 'validee'); },\n      modalRefuse: () => { this.updateOrderStatus(mo.id, 'refusee'); },\n      closeModal: () => this.setState({ modalOrder: null }),\n      cfgUrl: s.cfgUrl, onCfgUrlChange: e => this.setState({ cfgUrl: e.target.value }),\n      cfgKey: s.cfgKey, onCfgKeyChange: e => this.setState({ cfgKey: e.target.value }),\n      cfgSaved: s.cfgSaved,\n      saveConfig: () => {\n        try { const c = JSON.parse(localStorage.getItem('n3n_config') || '{}'); localStorage.setItem('n3n_config', JSON.stringify({ ...c, url: s.cfgUrl, key: s.cfgKey })); } catch(e) {}\n        this.setState({ cfgSaved: true });\n        setTimeout(() => this.setState({ cfgSaved: false }), 2500);\n      },\n      resendKey: s.resendKey, onResendKeyChange: e => this.setState({ resendKey: e.target.value }),\n      fromEmail: s.fromEmail, onFromEmailChange: e => this.setState({ fromEmail: e.target.value }),\n      resendSaved: s.resendSaved,\n      saveResend: () => {\n        try { const c = JSON.parse(localStorage.getItem('n3n_config') || '{}'); localStorage.setItem('n3n_config', JSON.stringify({ ...c, resendKey: s.resendKey, fromEmail: s.fromEmail })); } catch(e) {}\n        this.setState({ resendSaved: true });\n        setTimeout(() => this.setState({ resendSaved: false }), 2500);\n      },\n      newPass: s.newPass, onNewPassChange: e => this.setState({ newPass: e.target.value }),\n      passSaved: s.passSaved,\n      savePass: () => {\n        if (!s.newPass || s.newPass.length < 6) { alert('Mot de passe trop court (min 6 caractères)'); return; }\n        try { const c = JSON.parse(localStorage.getItem('n3n_config') || '{}'); localStorage.setItem('n3n_config', JSON.stringify({ ...c, adminPass: s.newPass })); } catch(e) {}\n        this.setState({ adminPass: s.newPass, newPass: '', passSaved: true });\n        setTimeout(() => this.setState({ passSaved: false }), 2500);\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
