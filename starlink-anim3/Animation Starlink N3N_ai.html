    const templateEl = document.querySelector('script[type="__bundler/template"]');

    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).

    }

      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };

      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }

    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {

        // parent.location.hash change), nudge the iframe.

>\n\n  <!-- top-left brand mark -->\n  <div style=\"position:absolute;top:5.4%;left:5%;z-index:6;animation:n3Brand var(--loop,16s) linear infinite;\">\n    <div style=\"display:flex;align-items:center;gap:11px;\">\n      <img src=\"1681dc2a-17aa-4490-a886-bfbca3c95a17\" alt=\"N3N_ai\" style=\"width:clamp(30px,3vw,42px);height:auto;display:block;filter:drop-shadow(0 4px 12px rgba(230,162,78,.35));\">\n      <div style=\"font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(15px,1.5vw,22px);letter-spacing:.5px;color:#F4EFE6;\">N3N<span style=\"color:var(--accent,#E6A24E);\">_ai<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- HERO dish (right) -->\n  <div style=\"position:absolute;top:50%;right:3%;width:50%;height:78%;transform:translateY(-50%);z-index:4;animation:n3Hero var(--loop,16s) ease-in-out infinite;\">\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n      <!-- orbital ring -->\n      <div style=\"position:absolute;width:74%;aspect-ratio:1;transform:rotateX(74deg);transform-style:preserve-3d;\">\n        <div style=\"position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(230,162,78,.28);\"><\u002Fdiv>\n        <sc-if value=\"{{ showSatellite }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;inset:0;animation:n3Orbit 9s linear infinite;\">\n            <div style=\"position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:3px;transform:rotateX(-74deg);background:linear-gradient(135deg,var(--accent,#E6A24E),#fff);box-shadow:0 0 14px rgba(230,162,78,.9);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <!-- signal rings -->\n      <div style=\"position:absolute;top:42%;left:50%;width:42%;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent,#E6A24E);animation:n3Ring 3.2s ease-out infinite;\"><\u002Fdiv>\n      <div style=\"position:absolute;top:42%;left:50%;width:42%;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent,#E6A24E);animation:n3Ring 3.2s ease-out infinite;animation-delay:1.06s;\"><\u002Fdiv>\n      <div style=\"position:absolute;top:42%;left:50%;width:42%;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent,#E6A24E);animation:n3Ring 3.2s ease-out infinite;animation-delay:2.13s;\"><\u002Fdiv>\n      <!-- dish image -->\n      <img src=\"570d4ad1-e5f2-4024-b4c9-0615da3395cd\" alt=\"Antenne Starlink\" style=\"position:relative;width:112%;max-height:none;object-fit:contain;filter:drop-shadow(0 30px 46px rgba(0,0,0,.5));animation:n3Float 7s ease-in-out infinite;z-index:2;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LEFT text scenes (stacked, cross-fade) -->\n  <div style=\"position:absolute;top:0;left:0;width:52%;height:100%;z-index:5;\">\n\n    <!-- scene 1 -->\n    <div style=\"position:absolute;top:50%;left:6%;width:84%;transform:translateY(-50%);animation:n3T1 var(--loop,16s) ease-in-out infinite;\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid rgba(230,162,78,.4);border-radius:100px;color:var(--accent,#E6A24E);font-size:clamp(11px,1vw,14px);font-weight:600;letter-spacing:2.5px;text-transform:uppercase;\">Internet par satellite<\u002Fdiv>\n      <h1 style=\"font-family:'Sora',sans-serif;font-weight:800;color:#F8F4EC;font-size:clamp(28px,4.4vw,64px);line-height:1.04;margin:20px 0 16px;letter-spacing:-1px;text-wrap:balance;\">Le haut débit, partout<br>au <span style=\"color:var(--accent,#E6A24E);\">Niger<\u002Fspan> avec <span style=\"color:var(--accent,#E6A24E);\">N3N_ai<\u002Fspan>.<\u002Fh1>\n      <p style=\"color:#AEB4CC;font-size:clamp(14px,1.5vw,21px);line-height:1.55;margin:0;max-width:30ch;\">Une connexion rapide et fiable, jusque dans les zones les plus reculées.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- scene 2 : stats -->\n    <div style=\"position:absolute;top:50%;left:6%;width:88%;transform:translateY(-50%);animation:n3T2 var(--loop,16s) ease-in-out infinite;\">\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:700;color:#F8F4EC;font-size:clamp(22px,3.2vw,46px);line-height:1.08;margin:0 0 26px;letter-spacing:-.5px;\">Des performances<br>qui changent tout.<\u002Fh2>\n      <div style=\"display:flex;gap:16px;\">\n        <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"3\">\n          <div style=\"flex:1;padding:20px 18px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);animation:n3CardPop var(--loop,16s) ease-in-out infinite;\">\n            <div style=\"font-family:'Sora',sans-serif;font-weight:800;color:var(--accent,#E6A24E);font-size:clamp(22px,2.8vw,38px);line-height:1;\">{{ st.value }}<\u002Fdiv>\n            <div style=\"color:#C8CCDD;font-size:clamp(12px,1.1vw,15px);font-weight:600;margin-top:8px;\">{{ st.label }}<\u002Fdiv>\n            <div style=\"color:#878DA6;font-size:clamp(10px,.95vw,13px);margin-top:3px;\">{{ st.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- scene 3 : CTA -->\n    <div style=\"position:absolute;top:50%;left:6%;width:84%;transform:translateY(-50%);animation:n3T3 var(--loop,16s) ease-in-out infinite;\">\n      <div style=\"font-family:'Sora',sans-serif;font-weight:500;color:var(--accent,#E6A24E);font-size:clamp(13px,1.2vw,17px);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;\">Disponible dès maintenant<\u002Fdiv>\n      <h2 style=\"font-family:'Sora',sans-serif;font-weight:800;color:#F8F4EC;font-size:clamp(26px,3.8vw,56px);line-height:1.05;margin:0 0 24px;letter-spacing:-.8px;\">Connectez-vous<br>au futur.<\u002Fh2>\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap;\">\n        <div style=\"display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:100px;background:linear-gradient(135deg,var(--accent,#E6A24E),#C0633A);color:#1a1009;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(14px,1.4vw,19px);box-shadow:0 14px 34px rgba(230,162,78,.34);\">Demander un devis →<\u002Fdiv>\n        <div style=\"color:#C8CCDD;font-size:clamp(14px,1.3vw,19px);font-weight:600;\">N3N_ai<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- INTRO overlay -->\n  <div style=\"position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 90% at 50% 40%, rgba(11,16,38,.35), rgba(7,10,28,.9) 75%);animation:n3Intro var(--loop,16s) ease-in-out infinite;\">\n    <div style=\"display:flex;align-items:center;gap:20px;margin-bottom:18px;\">\n      <img src=\"1681dc2a-17aa-4490-a886-bfbca3c95a17\" alt=\"N3N_ai\" style=\"width:clamp(64px,7vw,104px);height:auto;display:block;filter:drop-shadow(0 14px 34px rgba(230,162,78,.4));\">\n      <div style=\"font-family:'Sora',sans-serif;font-weight:800;color:#F8F4EC;font-size:clamp(40px,6.6vw,96px);letter-spacing:-2px;\">N3N<span style=\"color:var(--accent,#E6A24E);\">_ai<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;color:#AEB4CC;font-size:clamp(14px,1.5vw,22px);letter-spacing:4px;text-transform:uppercase;font-weight:600;\">\n      <span style=\"width:36px;height:1px;background:rgba(174,180,204,.5);\"><\u002Fspan>\n      Internet par satellite\n      <span style=\"width:36px;height:1px;background:rgba(174,180,204,.5);\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E6A24E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Lent&quot;,&quot;Normal&quot;,&quot;Rapide&quot;],&quot;default&quot;:&quot;Normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showSatellite&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const speedMap = { 'Lent': '22s', 'Normal': '16s', 'Rapide': '11s' };\n    const loop = speedMap[this.props.speed] || '16s';\n    const accent = this.props.accent || '#E6A24E';\n    const showSatellite = this.props.showSatellite ?? true;\n\n    // deterministic-ish starfield\n    const stars = [];\n    let seed = 7;\n    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };\n    for (let i = 0; i < 38; i++) {\n      const top = (rnd() * 78).toFixed(2);\n      const left = (rnd() * 100).toFixed(2);\n      const size = (rnd() * 2 + 1).toFixed(2);\n      const dur = (rnd() * 3 + 2.5).toFixed(2);\n      const delay = (rnd() * 4).toFixed(2);\n      const op = (rnd() * 0.5 + 0.4).toFixed(2);\n      stars.push({ css:\n        `position:absolute;top:${top}%;left:${left}%;width:${size}px;height:${size}px;border-radius:50%;`+\n        `background:#fff;opacity:${op};box-shadow:0 0 6px rgba(255,255,255,.7);`+\n        `animation:n3Twinkle ${dur}s ease-in-out ${delay}s infinite;`\n      });\n    }\n\n    const stats = [\n      { value: '100+ Mb/s', label: 'Débit rapide', sub: 'streaming & visio fluides' },\n      { value: '≈ 25 ms', label: 'Faible latence', sub: 'idéal pour le travail' },\n      { value: 'Partout', label: 'Couverture totale', sub: 'villes & zones rurales' },\n    ];\n\n    return { stars, stats, loop, accent, showSatellite };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Animation Starlink N3N.dc"}
